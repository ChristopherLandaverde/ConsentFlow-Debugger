<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none';">
  <title>ConsentFlow Debugger</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <img class="mark" src="../icons/icon-32.png" width="16" height="16" alt="">
    <span class="product">ConsentFlow</span>
    <span id="pageMeta" class="bar-meta"></span>
  </header>

  <main>
    <!-- The verdict: one sentence, computed once, feeds every summary on this screen. -->
    <section id="verdict" class="verdict" data-state="loading" aria-live="polite" aria-atomic="true">
      <p id="verdictLabel" class="status-tag loading">– READING PAGE</p>
      <h1 id="verdictTitle" class="verdict-title">Reading this page…</h1>
      <p id="verdictDetail" class="verdict-detail">Capture starts when the page loads. Results appear in a few seconds.</p>
      <div id="progress" class="progress" role="progressbar" aria-label="Reading the page"><span></span></div>
      <button id="errorAction" class="btn primary" type="button" hidden>Reload page</button>
    </section>

    <section id="findings" class="findings" aria-label="Findings" hidden></section>

    <div id="actions" class="actions" hidden>
      <button id="openTraceBtn" class="btn primary" type="button">Open full trace</button>
      <button id="recheckBtn" class="btn secondary" type="button">Reload and recheck</button>
      <p id="checkedAt" class="meta"></p>
      <p id="traceHint" class="hint" role="status" hidden></p>
    </div>

    <p id="reviewCta" class="review-cta" hidden>
      Stuck on this? <button id="reviewCtaButton" class="link" type="button">Discuss a system review ↗</button>
    </p>
  </main>

  <script src="findings.js"></script>
  <script src="render.js"></script>
  <script src="ui-state.js"></script>
  <script src="popup.js"></script>
</body>
</html>
